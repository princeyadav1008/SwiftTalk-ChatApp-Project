<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Dark gradient background -->
    <rect width="1440" height="1024" fill="url(#gradient)"/>
    
    <!-- Pattern overlay -->
    <g opacity="0.12">
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M30 0L0 30M60 30L30 60M60 0L0 60" stroke="#818cf8" stroke-width="0.5"/>
        </pattern>
        <rect width="100%" height="100%" fill="url(#grid)"/>
    </g>

    <!-- SwiftTalk Text repeated in a pattern with increased opacity and brighter color -->
    <g opacity="0.25">
        <pattern id="text-pattern" width="400" height="200" patternUnits="userSpaceOnUse">
            <text x="50" y="80" fill="#c7d2fe" font-family="Arial Black" font-size="56" font-weight="800">SwiftTalk</text>
            <text x="220" y="160" fill="#e0e7ff" font-family="Arial Black" font-size="40" font-weight="700">SwiftTalk</text>
        </pattern>
        <rect width="100%" height="100%" fill="url(#text-pattern)"/>
    </g>

    <!-- Large centered SwiftTalk watermark for visibility -->
    <g>
        <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        <text x="50%" y="48%" textAnchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="120" font-weight="800" opacity="0.18" filter="url(#glow)">SwiftTalk</text>
    </g>

    <!-- Enhanced glowing orbs -->
    <circle cx="200" cy="300" r="180" fill="url(#glow1)" opacity="0.2"/>
    <circle cx="1200" cy="700" r="220" fill="url(#glow2)" opacity="0.15"/>
    <circle cx="600" cy="200" r="200" fill="url(#glow3)" opacity="0.18"/>
    
    <!-- Definitions -->
    <defs>
        <!-- Main background gradient -->
        <linearGradient id="gradient" x1="0" y1="0" x2="1440" y2="1024" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>
        
        <!-- Enhanced glow effects -->
        <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
        </radialGradient>
        
        <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
        </radialGradient>
        
        <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#a5b4fc"/>
            <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Floating dots with increased brightness -->
    <g opacity="0.3">
        <circle cx="100" cy="100" r="2" fill="#a5b4fc"/>
        <circle cx="400" cy="500" r="2" fill="#818cf8"/>
        <circle cx="900" cy="300" r="2" fill="#a5b4fc"/>
        <circle cx="1200" cy="200" r="2" fill="#818cf8"/>
        <circle cx="700" cy="800" r="2" fill="#a5b4fc"/>
        <circle cx="300" cy="900" r="2" fill="#818cf8"/>
    </g>

    <!-- Additional light accent lines -->
    <g opacity="0.1">
        <line x1="0" y1="200" x2="1440" y2="200" stroke="#818cf8" stroke-width="1"/>
        <line x1="0" y1="600" x2="1440" y2="600" stroke="#818cf8" stroke-width="1"/>
        <line x1="400" y1="0" x2="400" y2="1024" stroke="#818cf8" stroke-width="1"/>
        <line x1="1000" y1="0" x2="1000" y2="1024" stroke="#818cf8" stroke-width="1"/>
    </g>
</svg>